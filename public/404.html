<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Annapurna Pizza Co.</title>
  <script>
    // GitHub Pages SPA redirect — encodes the path into query string and
    // redirects to index.html, where it is decoded and restored via history.replaceState.
    // segmentCount = 1 for a project page hosted at /Annapurna_Pizza_Co/
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
</html>
